name: Accuracy bug report
description: Create a bug report to help us fix incorrect wording in evryBuild - POB for LocalExile.
labels: ["bug: accuracy"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with evryBuild - POB for LocalExile.
        [Export setup and known limitations](https://github.com/LocalExile/evryBuild/blob/master/docs/LocalExile.md).
        Please try to fill in as much of the form below as you're able to. Fields marked with an asterisk (*) are required.
  - type: checkboxes
    id: version
    attributes:
      label: Check version
      options:
        - label: I've checked the [latest evryBuild release and its notes](https://github.com/LocalExile/evryBuild/releases/latest)
          required: true
  - type: checkboxes
    id: duplicates
    attributes:
      label: Check for duplicates
      options:
        - label: I've checked for duplicate open **and closed** issues by using the search function of the [issue tracker](https://github.com/LocalExile/evryBuild/issues?q=is%3Aissue)
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: What platform are you running evryBuild on?
      options: 
        - Windows
        - Linux - Wine
        - Linux - PoB Frontend
        - MacOS
      default: 0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What is the wording in-game?
      description: Please write a clear and concise description of what should happen.
      placeholder: |
        E.g. when I look at the unique [...] in-game it says [...].
        [screenshot].
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What is the wording in evryBuild?
      description: Please write a clear and concise description of what actually happens.
      placeholder: |
        E.g. When I look at the unique [...] in evryBuild it says [...].
        [screenshot].
    validations:
      required: true
  - type: textarea
    id: build_code
    attributes:
      label: PoB build code
      description: Always provide a build code that exhibits the bug you want to report, even if it is not specific to a particular build. This helps us greatly to reproduce bugs faster.
      placeholder: This can be either a code copied from the "Import/Export Build" tab or an attached saved XML file.
      render: shell
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Screenshots
      description: Always provide screenshots of the problematic wording if possible. GIFs or short videos are also okay, if the bug cannot be displayed in a still image.
      placeholder: In this text area, you can attach files/images (copy paste) directly, or link to them if they're hosted elsewhere instead.
    validations:
      required: false
